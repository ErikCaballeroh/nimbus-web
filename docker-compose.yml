services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      # Host port 5433, not 5432, so it never collides with a native Postgres
      # install on the developer's machine.
      - "5433:5432"
    volumes:
      - nimbus_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nimbus_pgdata:
